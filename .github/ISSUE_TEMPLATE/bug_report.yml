name: Bug report
description: Report something broken on the site or in the codebase
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security issues, use [SECURITY.md](../../SECURITY.md) instead of this form.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
      placeholder: The mobile nav does not close after route change on iOS Safari.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps help us reproduce faster.
      placeholder: |
        1. Open https://haroonabidawan.com on mobile
        2. Open the navigation menu
        3. Tap About
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production (haroonabidawan.com)
        - Local development
        - Vercel preview
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / device
      placeholder: Chrome 131 on Android 14

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag and drop images or paste links.

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues before opening this report
          required: true
