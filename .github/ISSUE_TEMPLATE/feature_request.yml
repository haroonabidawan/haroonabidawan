name: Feature request
description: Suggest an improvement to the portfolio site or repo
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome. Large changes may be declined if they do not fit the portfolio scope or brand direction.

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user or maintainer problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Copy or content
        - UI or UX
        - Performance
        - Accessibility
        - Developer experience
        - Other
    validations:
      required: true

  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this if approved
        - label: I searched existing issues before opening this request
